<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Student Result | TEAS ACCESS</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="login-container">

<div class="login-card" style="max-width:800px;">

<h2>Student Result</h2>

<form id="studentForm">

<div class="form-group">

<label>Student Name</label>

<input
type="text"
id="studentName"
required>

</div>

<div class="form-group">

<label>TEAS Score</label>

<input
type="number"
step="0.1"
id="studentScore"
required>

</div>

<div class="form-group">

<label>Program</label>

<input
type="text"
id="studentProgram"
placeholder="RN, BSN, ADN...">

</div>

<div class="form-group">

<label>Attempt</label>

<input
type="text"
id="studentAttempt"
placeholder="1st Attempt">

</div>

<div class="form-group">

<label>Student Review</label>

<textarea
id="studentReview"
rows="5"></textarea>

</div>

<div class="form-group">

<label>Image URL</label>

<input
type="url"
id="studentImage">

</div>

<div
style="text-align:center;margin:20px 0;">

<img

id="imagePreview"

style="
max-width:250px;
display:none;
border-radius:12px;
">

</div>

<div class="form-group">

<label>

<input
type="checkbox"
id="featured">

Featured Result

</label>

</div>

<div class="form-group">

<label>Display Order</label>

<input
type="number"
id="displayOrder"
value="0">

</div>

<button
class="login-btn"
type="submit">

Save Changes

</button>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="js/login.js"></script>

<script src="js/edit-student.js"></script>

</body>

</html>
